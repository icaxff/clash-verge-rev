name: 🔑 Generate Tauri Signing Keys (DO NOT KEEP)
on:
  workflow_dispatch:
    inputs:
      key_password:
        description: '密码'
        required: true
        type: string
        
jobs:
  generate_key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Generate Key Pair
        id: generate
        run: |
          npx tauri signer generate --password "${{ github.event.inputs.key_password }}"
